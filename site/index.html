<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Ninja Playground</title>
<meta name=description content="Tiny games, big chaos. No login. No cap.">
<meta name=theme-color id=themecolor content="#2a0a1a">
<link rel=icon href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff8a3d'/%3E%3Cpath d='M50 12 60 40 88 50 60 60 50 88 40 60 12 50 40 40Z' fill='%23111'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23ff8a3d'/%3E%3C/svg%3E">
<style>
/* Four palettes. Default = sunset. Every colour below comes from these variables. */
:root{--ink:#111;--paper:#fff8ee;--bg:#2a0a1a;--glow1:#6a1a3a;--glow2:#7a3a0a;--a:#ff8a3d;--b:#ff4f9a;--c:#ffe14d;--d:#38e1ff;--e:#c9a0ff;--f:#c6ff3d}
[data-theme=grape]{--bg:#1a0b2e;--glow1:#4a1a7a;--glow2:#7a1a55;--a:#c6ff3d;--b:#ff4fd8;--c:#ffe14d;--d:#29e7ff;--e:#9a82ff;--f:#ff8a3d}
[data-theme=ocean]{--bg:#06182b;--glow1:#0a4a7a;--glow2:#0a6a5a;--a:#5cffc8;--b:#4f9bff;--c:#ffe14d;--d:#ff6fb5;--e:#b9a6ff;--f:#7dff6a}
[data-theme=glitch]{--bg:#0b0b0b;--glow1:#222;--glow2:#1d2a0a;--a:#b6ff00;--b:#ff2e63;--c:#ffd400;--d:#00e5ff;--e:#f1f1f1;--f:#ff8a00}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--paper);overflow-x:hidden;
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  background:radial-gradient(#ffffff14 1.5px,transparent 2px) 0 0/22px 22px,radial-gradient(circle at 15% 0,var(--glow1),transparent 45%),radial-gradient(circle at 100% 30%,var(--glow2),transparent 40%),var(--bg);transition:background-color .3s}
a{color:inherit}
.marquee{background:var(--a);color:var(--ink);border-block:3px solid var(--ink);overflow:hidden;white-space:nowrap;font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:.9rem}
.marquee div{display:inline-block;padding:9px 0;animation:slide 26s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
main{max-width:1080px;margin:0 auto;padding:18px 18px 70px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem;text-decoration:none}
.brand svg{width:38px;height:38px;background:var(--a);border:3px solid var(--ink);border-radius:12px;padding:4px;box-shadow:3px 3px 0 #000;transition:transform .5s}
.brand:hover svg{transform:rotate(360deg)}
.right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.swatches{display:flex;gap:6px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:3px solid var(--paper);padding:0;cursor:pointer;box-shadow:2px 2px 0 #000;transition:transform .12s}
.sw:hover{transform:scale(1.15)}.sw[aria-pressed=true]{outline:3px solid var(--paper);outline-offset:2px}
.pill{background:var(--b);color:var(--ink);font-weight:900;border:3px solid var(--ink);border-radius:99px;padding:5px 14px;box-shadow:3px 3px 0 #000;font-size:.85rem;transform:rotate(2deg)}

.hero{position:relative;padding:30px 0 6px}
.hero h1{margin:0;font-size:clamp(2.4rem,8.5vw,5rem);line-height:.98;font-weight:900;letter-spacing:-.04em;text-transform:lowercase}
.hl{display:inline-block;color:var(--ink);padding:0 .14em;border-radius:.18em;border:3px solid var(--ink);box-shadow:5px 5px 0 #000}
.hl.a{background:var(--b);transform:rotate(-2.5deg)}
.hl.b{background:var(--a);transform:rotate(1.8deg)}
.hero p{font-size:clamp(1rem,2.4vw,1.25rem);max-width:560px;margin:16px 0 0;opacity:.92;line-height:1.4}
.sticker{position:absolute;font-weight:900;color:var(--ink);border:3px solid var(--ink);box-shadow:4px 4px 0 #000;border-radius:14px;padding:6px 12px;animation:float 4s ease-in-out infinite}
.s1{background:var(--c);right:1%;top:14px;transform:rotate(8deg)}
.s2{background:var(--d);right:15%;top:96px;transform:rotate(-6deg);animation-delay:-2s}
@keyframes float{50%{translate:0 -9px}}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:20px}
.dice{font:inherit;font-weight:900;font-size:1.05rem;cursor:pointer;background:var(--c);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:11px 18px;box-shadow:5px 5px 0 #000;transition:transform .12s,box-shadow .12s}
.dice:hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:8px 8px 0 #000}
.dice:active{transform:translate(4px,4px);box-shadow:1px 1px 0 #000}
.vibe{background:#ffffff12;border:2px dashed #ffffff55;border-radius:14px;padding:8px 14px;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px;margin-top:34px}
.card{--r:0deg;position:relative;display:flex;flex-direction:column;gap:12px;background:var(--cc);color:var(--ink);border:3px solid var(--ink);border-radius:24px;padding:22px;text-decoration:none;box-shadow:7px 7px 0 #000;transform:rotate(var(--r));transition:transform .15s,box-shadow .15s}
.card:nth-child(odd){--r:-1.2deg}.card:nth-child(even){--r:1deg}
.card:hover,.card.pick{transform:rotate(0) translate(-3px,-3px) scale(1.02);box-shadow:11px 11px 0 #000}
.card:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #000}
.top{display:flex;align-items:center;gap:12px}
.icon{width:62px;height:62px;border-radius:18px;border:3px solid var(--ink);object-fit:cover;background:var(--paper);display:grid;place-items:center;font-size:2rem;flex:none;box-shadow:3px 3px 0 #000}
.card h2{margin:0;font-size:1.5rem;line-height:1.05;font-weight:900;letter-spacing:-.02em}
.card p{margin:0;line-height:1.4;font-weight:600;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:800}
.play{align-self:flex-start;background:var(--ink);color:var(--paper);font-weight:900;border-radius:99px;padding:10px 20px;transition:transform .12s}
.card:hover .play{transform:translateX(5px)}
.hot{position:absolute;top:-14px;right:18px;background:var(--ink);color:var(--c);font-weight:900;border-radius:99px;padding:4px 12px;font-size:.8rem;transform:rotate(3deg)}
@media(min-width:760px){
  .feature{grid-column:span 2;padding:28px}
  .feature h2{font-size:2.3rem}.feature .icon{width:92px;height:92px;font-size:3rem;border-radius:24px}
  .feature p{font-size:1.15rem}.feature .play{font-size:1.1rem;padding:12px 26px}
}
.soon{background:transparent;color:var(--paper);border-style:dashed;border-color:#ffffff66;box-shadow:none;align-items:center;justify-content:center;text-align:center;min-height:170px;font-weight:800;font-size:1.1rem}
footer{margin-top:56px;opacity:.8;font-weight:700;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
.burst{position:fixed;pointer-events:none;z-index:99;font-size:22px}
@media(max-width:560px){.s2{display:none}.s1{right:0;top:-4px}.right{width:100%;justify-content:space-between}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<div class=marquee><div id=ticker></div></div>
<main>
  <nav class=nav>
    <a class=brand href="./"><svg viewBox="0 0 100 100" aria-hidden=true><path d="M50 6 61 39 94 50 61 61 50 94 39 61 6 50 39 39Z" fill="#111"/><circle cx="50" cy="50" r="9" fill="var(--a)"/></svg>ninja playground</a>
    <div class=right><div class=swatches id=swatches role=group aria-label="Pick a colour vibe"></div><span class=pill id=count>loading…</span></div>
  </nav>
  <section class=hero>
    <span class="sticker s1">no cap 🧢</span><span class="sticker s2">say less 🤝</span>
    <h1>tiny games.<br><span class="hl a">big</span> <span class="hl b">chaos.</span></h1>
    <p>no login. no ads. just games you play with your besties, right from your phone. we ate, now you play.</p>
    <div class=cta>
      <button class=dice id=dice>🎲 idk, surprise me</button>
      <span class=vibe id=vibe></span>
    </div>
  </section>
  <section class=grid id=grid><div class="card soon">loading the good stuff…</div></section>
  <footer><span>made with vibes + Claude ✌️</span><span>new games drop here when they're done</span></footer>
</main>
<script>
const h=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...k);return e;}; // textContent only, so project text can never inject HTML
const COLORS=['--a','--b','--d','--c','--e','--f'];
const VIBES=['bestie said play 🫶','delulu is the solulu ✨','serving fun, no crumbs 🍽️','it\'s giving main character 💅','brain rot but make it fun 🧠','no thoughts, head empty 😵‍💫','we love a quick game 💜','this one slaps 👏'];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.getElementById('vibe').textContent=VIBES[Math.floor(Math.random()*VIBES.length)];
const words=['no cap','play now','it\'s giving game night','free fr','no login','bestie approved','say less','W'];
document.getElementById('ticker').textContent=[...words,...words].map(w=>w+'  ✦  ').join('').repeat(2); // doubled so the loop is seamless

/* colour vibes: remembered in this browser, applied before anything is drawn */
const THEMES=[['sunset','#ff8a3d','#ff4f9a'],['grape','#c6ff3d','#ff4fd8'],['ocean','#5cffc8','#4f9bff'],['glitch','#b6ff00','#ff2e63']];
const BG={sunset:'#2a0a1a',grape:'#1a0b2e',ocean:'#06182b',glitch:'#0b0b0b'};
function setTheme(t,save=true){
  document.documentElement.dataset.theme=t;document.getElementById('themecolor').content=BG[t];
  if(save)try{localStorage.setItem('ninja.theme',t);}catch{}
  document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));
}
const sw=document.getElementById('swatches');
for(const[t,x,y]of THEMES){const b=h('button',{className:'sw',title:t+' vibe','aria-label':t+' colours'});b.dataset.t=t;b.style.background=`linear-gradient(135deg,${x} 50%,${y} 50%)`;b.onclick=()=>setTheme(t);sw.append(b);}
let saved=null;try{saved=localStorage.getItem('ninja.theme');}catch{}
setTheme(BG[saved]?saved:'sunset',false);

function burst(x,y){ // little emoji confetti where you click
  if(reduce)return;
  for(let i=0;i<14;i++){
    const e=h('div',{className:'burst',textContent:['✨','🔥','💥','⭐','🎉','💜'][i%6]});e.style.left=x+'px';e.style.top=y+'px';document.body.append(e);
    const a=Math.random()*Math.PI*2,d=60+Math.random()*110;
    e.animate([{transform:'translate(0,0) scale(.5)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(${Math.random()*360}deg) scale(1.2)`,opacity:0}],{duration:800+Math.random()*400,easing:'ease-out'}).onfinish=()=>e.remove();
  }
}
fetch('projects.json',{cache:'no-store'}).then(r=>r.json()).then(list=>{
  const grid=document.getElementById('grid');grid.replaceChildren();
  document.getElementById('count').textContent=`${list.length} game${list.length===1?'':'s'} · 0 sign-ups · ∞ vibes`;
  list.forEach((p,i)=>{
    const icon=p.icon?h('img',{className:'icon',src:p.href+p.icon,alt:'',loading:'lazy'}):h('div',{className:'icon',textContent:p.emoji||'🎲'});
    const card=h('a',{className:'card'+(i===0?' feature':''),href:p.href},
      ...(i===0?[h('span',{className:'hot',textContent:'🔥 hot right now'})]:[]),
      h('div',{className:'top'},icon,h('h2',{textContent:p.title})),
      h('p',{textContent:p.tagline||''}),
      h('div',{className:'tags'},...[...(p.auth?['🔒 sign-in']:[]),...(p.tags||[])].map(t=>h('span',{className:'tag',textContent:t}))),
      h('span',{className:'play',textContent:'play →'}));
    card.style.setProperty('--cc',`var(${COLORS[i%COLORS.length]})`);
    card.addEventListener('click',e=>burst(e.clientX,e.clientY));
    grid.append(card);
  });
  grid.append(h('div',{className:'card soon',textContent:'next game loading… 👀 (we\'re cooking)'}));
  document.getElementById('dice').onclick=e=>{ // choose a random game, wiggle it, then go
    const cards=[...grid.querySelectorAll('a.card')];if(!cards.length)return;
    const c=cards[Math.floor(Math.random()*cards.length)];
    cards.forEach(x=>x.classList.remove('pick'));c.classList.add('pick');c.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});
    burst(e.clientX,e.clientY);setTimeout(()=>{window.location.href=c.getAttribute('href');},reduce?200:1100);
  };
}).catch(()=>{document.getElementById('grid').replaceChildren(h('div',{className:'card soon',textContent:'could not load the games. open this page from a web server, not as a file.'}));document.getElementById('count').textContent='oops';});
</script>
